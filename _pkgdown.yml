url: https://mar-cald.github.io/multibayes/
template:
  bootstrap: 5
  includes:
    in_header: |
      <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" type="text/javascript"></script>
destination: docs
# the manuscript in pkgdown/assets cannot be converted to Markdown
llm-docs: false
navbar:
  structure:
    left:
    - reference
    - articles
    - paper
  components:
    paper:
      text: Paper
      menu:
      - text: HTML
        href: manuscript.html
      - text: PDF
        href: manuscript.pdf
reference:
- title: Probability of Direction
  contents:
    - pd.adjust
    - print.pd_adjust
- title: Joint Posterior 
  contents:
    - joint

